# ============================================================
# nginx 反向代理 — api.aatist.fi
# 放到 /etc/nginx/sites-available/api.aatist.fi.conf 并软链到 sites-enabled
# 然后: sudo certbot --nginx -d api.aatist.fi  自动补全 SSL 证书段
# ============================================================

# WebSocket 升级支持(/api/v1/ws 实时聊天需要)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.aatist.fi;

    # certbot HTTP-01 校验
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    # 其余一律跳 HTTPS(certbot --nginx 也会自动加这段)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.aatist.fi;

    # ---- 证书(certbot --nginx 会自动填写以下两行)----
    ssl_certificate     /etc/letsencrypt/live/api.aatist.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aatist.fi/privkey.pem;

    # 上传体积上限(头像/作品图,按需调大)
    client_max_body_size 25m;

    # ---- 对象存储:反代到本机 MinIO ----
    # backend 写 avatars 桶,file-service 写 files 桶;路径前缀即桶名
    location /avatars/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /files/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- WebSocket:实时聊天,长连接单独配长超时 ----
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 其余全部转给网关(/api/v1/*、/auth/callback/google、/gateway/health)----
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
